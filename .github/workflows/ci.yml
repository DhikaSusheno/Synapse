name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile (syntax check)
        run: python -m compileall -q .

      - name: Verify deprecated APIs are gone
        run: |
          # DEBT: datetime.utcnow() dihapus di Python 3.12
          if grep -rn "utcnow()" --include="*.py" . ; then
            echo "::error:: datetime.utcnow() masih dipakai"
            exit 1
          fi
          # DEBT: @app.on_event("startup") deprecated di FastAPI 0.109+
          if grep -rn "on_event(" --include="*.py" . ; then
            echo "::error:: on_event() masih dipakai"
            exit 1
          fi

      - name: CORS wildcard check
        run: |
          if grep -rn 'allow_origins=\["\*"\]' --include="*.py" . ; then
            echo "::error:: allow_origins wildcard masih ada (BUG-11)"
            exit 1
          fi

      - name: Run pytest
        env:
          SYNAPSE_API_TOKEN: ci-test-token-abcdefghijklmnop
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          SYNAPSE_API_TOKEN: ci-test-token-abcdefghijklmnop
        run: npm run build
