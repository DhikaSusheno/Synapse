name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../security/requirements-test.txt

      - name: Byte-compile (syntax check)
        run: python -m compileall -q .

      - name: Verify deprecated APIs are gone
        run: |
          # DEBT: datetime.utcnow() dihapus di Python 3.12
          if grep -rn "utcnow()" --include="*.py" . ; then
            echo "::error:: datetime.utcnow() masih dipakai"
            exit 1
          fi
          # DEBT: @app.on_event("startup") deprecated di FastAPI 0.109+
          if grep -rn "on_event(" --include="*.py" . ; then
            echo "::error:: on_event() masih dipakai"
            exit 1
          fi

      - name: CORS wildcard check
        run: |
          if grep -rn 'allow_origins=\["\*"\]' --include="*.py" . ; then
            echo "::error:: allow_origins wildcard masih ada (BUG-11)"
            exit 1
          fi

      # WAJIB dijalankan dari repo root dengan path eksplisit.
      # Sebelumnya step ini jalan dari working-directory: backend, dan pytest
      # hanya menerapkan `testpaths` dari pytest.ini kalau invocation dir ==
      # rootdir. Dari backend/ pytest mengumpulkan [backend/] saja (120 test),
      # jadi seluruh security/tests (127 test, termasuk suite regresi
      # path-traversal isu #63/#66) TIDAK PERNAH jalan di CI — CI hijau
      # padahal regresinya lolos senyap. Path eksplisit + guard jumlah
      # pengumpulan bikin suite ini tidak bisa menyusut diam-diam.
      # Referensi: pytest _pytest/config/__init__.py::_decide_args
      - name: Run pytest (backend + security)
        env:
          SYNAPSE_API_TOKEN: ci-test-token-abcdefghijklmnop
        working-directory: .
        run: |
          set -e
          SEC=$(python -m pytest --collect-only -q security/tests | tail -1 | awk '{print $1}')
          BACK=$(python -m pytest --collect-only -q backend/tests | tail -1 | awk '{print $1}')
          echo "collected: security/tests=$SEC backend/tests=$BACK"
          if [ "${SEC:-0}" -lt 100 ]; then
            echo "::error::security/tests cuma mengumpulkan $SEC test"
            exit 1
          fi
          if [ "${BACK:-0}" -lt 100 ]; then
            echo "::error::backend/tests cuma mengumpulkan $BACK test"
            exit 1
          fi
          python -m pytest -q backend/tests security/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22.6+ untuk --experimental-strip-types, 23.6+ strip_types
          # on by default. Node 20 TIDAK bisa menjalankan file test .ts sama
          # sekali ("Could not find lib/*.test.ts").
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          SYNAPSE_API_TOKEN: ci-test-token-abcdefghijklmnop
        run: npm run build
